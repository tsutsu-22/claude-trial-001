<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toolshed</title>
<meta name="description" content="自作ツールをまとめた個人用ポータル。" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Toolshed" />
<meta name="theme-color" content="#1b1e24" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>" />
<style>
  :root {
    --bg: #1b1e24;
    --panel: #23272f;
    --panel-hover: #292e37;
    --border: #343b46;
    --text: #edeef1;
    --text-dim: #9aa1ad;
    --text-faint: #5f6672;
    --accent: #c98a3f;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1.3px) 0 0/26px 26px,
      var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 20px 40px;
  }

  header { margin-bottom: 34px; }
  h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 10px;
    text-wrap: balance;
  }
  h1 .mark { color: var(--accent); }
  header p {
    margin: 8px 0 0;
    color: var(--text-dim);
    font-size: 0.92rem;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 18px 16px;
    text-decoration: none;
    color: var(--text);
    --swatch: var(--accent);
  }
  .card::before {
    content: "";
    position: absolute;
    top: -7px;
    left: 24px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--swatch);
  }
  .card:hover { background: var(--panel-hover); border-color: var(--swatch); }
  .card:focus-visible { outline: 2px solid var(--swatch); outline-offset: 2px; }

  .card .icon { font-size: 1.9rem; line-height: 1; }
  .card .name { font-size: 1.15rem; font-weight: 700; }
  .card .desc {
    font-size: 0.84rem;
    color: var(--text-dim);
    line-height: 1.5;
    flex: 1;
  }
  .card .tag {
    align-self: flex-start;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--swatch);
    font-family: ui-monospace, monospace;
    border: 1px solid var(--swatch);
    border-radius: 4px;
    padding: 2px 7px;
    opacity: 0.9;
  }

  .card.placeholder {
    align-items: center;
    justify-content: center;
    text-align: center;
    border-style: dashed;
    color: var(--text-faint);
    min-height: 148px;
  }
  .card.placeholder .icon { color: var(--text-faint); font-size: 1.6rem; }
  .card.placeholder .name { font-size: 0.88rem; font-weight: 600; color: var(--text-faint); }

  footer {
    margin-top: 40px;
    font-size: 0.76rem;
    color: var(--text-faint);
    font-family: ui-monospace, monospace;
  }
  footer a { color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="mark">🛠️</span> Toolshed</h1>
    <p>tsutsu-22/claude-trial-001 — 自作ツール一覧</p>
  </header>

  <div class="grid">
    <a class="card" href="todo/" style="--swatch:#2454c4">
      <span class="icon">🗒️</span>
      <span class="name">Pocket Ledger</span>
      <span class="desc">タスクとメモをさっと書き留めて消し込める、スマホ向けのシンプルなチェックリスト。</span>
      <span class="tag">ToDo / Memo</span>
    </a>

    <a class="card" href="trace-viewer/" style="--swatch:#9b6fd1">
      <span class="icon">🧵</span>
      <span class="name">Threadline</span>
      <span class="desc">Claude agentセッション(サブエージェント/スキル/ツール呼び出し)をツリーとタイムラインで可視化。</span>
      <span class="tag">Dev Tool</span>
    </a>

    <div class="card placeholder">
      <span class="icon">＋</span>
      <span class="name">次のツールを準備中</span>
    </div>
  </div>

  <footer>Static site · GitHub Pages · no backend</footer>
</div>
</body>
</html>
